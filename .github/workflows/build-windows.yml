name: Build G00 CAM (Windows)

# Builds the one-folder Windows app with PyInstaller, checks it with --selftest, wraps it in an
# installer (G00-CAM-Setup.exe, Inno Setup), installs that and self-tests the installed copy.
# Artifacts on the run's Summary page: "G00 CAM Setup" (the installer) and "G00 CAM Rev1"
# (the plain folder, as a fallback).
on:
  push:
    paths:
      - "gsend_cad/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,dev]" pyinstaller

      - name: Core and kernel tests
        run: python -m pytest -q tests/test_core.py tests/test_kernel.py

      - name: Build exe
        run: pyinstaller packaging/g00cam.spec --noconfirm

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $exe = "dist\G00 CAM\G00 CAM.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = python -c "import gsend_cad; print(gsend_cad.__version__)"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$ver" packaging\g00cam.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-Item dist\installer\G00-CAM-Setup.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB)}}

      - name: Install silently and self-test the installed copy
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\G00 CAM test install"
          $t = Measure-Command {
            $p = Start-Process dist\installer\G00-CAM-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installer failed with exit code $($p.ExitCode)" }
          }
          "installed in {0:N0} s" -f $t.TotalSeconds
          $p = Start-Process -FilePath "$dir\G00 CAM.exe" -ArgumentList "--selftest", "$PWD\selftest_installed.txt" -Wait -PassThru
          Get-Content selftest_installed.txt
          if ($p.ExitCode -ne 0) { throw "installed selftest failed with exit code $($p.ExitCode)" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          "uninstall exit code $($p.ExitCode)"

      - uses: actions/upload-artifact@v4
        with:
          name: G00 CAM Setup
          path: dist/installer/G00-CAM-Setup.exe
          retention-days: 90
          compression-level: 0          # already compressed
          if-no-files-found: error

      - name: Package folder
        shell: pwsh
        run: |
          Copy-Item packaging\READ_ME_FIRST.txt "dist\G00 CAM\"
          Rename-Item "dist\G00 CAM" "G00 CAM Rev1"
          "{0:N0} MB" -f ((Get-ChildItem "dist\G00 CAM Rev1" -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: G00 CAM Rev1
          path: dist/G00 CAM Rev1/
          retention-days: 90
          # sklearn keeps its DLLs in "sklearn\.libs"; without this the dot-folder is
          # dropped from the zip and the exe dies on start (vcomp140.dll not found).
          include-hidden-files: true
          if-no-files-found: error

      # Self-test what Shane actually downloads, not the local dist folder.
      - uses: actions/download-artifact@v4
        with:
          name: G00 CAM Rev1
          path: artifact-check/G00 CAM Rev1

      - name: Self-test the downloaded artifact
        shell: pwsh
        run: |
          $dir = "artifact-check\G00 CAM Rev1"
          if (-not (Test-Path "$dir\_internal\sklearn\.libs\vcomp140.dll")) { throw "artifact is missing sklearn\.libs\vcomp140.dll" }
          $srcCount = (Get-ChildItem "dist\G00 CAM Rev1" -Recurse -File -Force).Count
          $dlCount  = (Get-ChildItem $dir -Recurse -File -Force).Count
          "files: built $srcCount, downloaded $dlCount"
          if ($srcCount -ne $dlCount) { throw "artifact file count differs from the build" }
          $p = Start-Process -FilePath "$dir\G00 CAM.exe" -ArgumentList "--selftest", "$PWD\selftest_artifact.txt" -Wait -PassThru
          Get-Content selftest_artifact.txt
          if ($p.ExitCode -ne 0) { throw "artifact selftest failed with exit code $($p.ExitCode)" }
