[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gsend-cad"
version = "0.1.0"
description = "G-SEND.IO CAD module: sketch, extrude and B-rep solids with a Fusion-style UI"
requires-python = ">=3.10"
dependencies = []                      # gsend_cad.core needs nothing

[project.optional-dependencies]
kernel = ["build123d>=0.9", "numpy"]
ui = ["build123d>=0.9", "numpy", "PySide6>=6.6", "pyvista>=0.43", "pyvistaqt>=0.11"]
dev = ["pytest", "pillow"]

[project.scripts]
gsend-cad = "gsend_cad.ui.app:main"

[tool.setuptools.packages.find]
include = ["gsend_cad*"]

[tool.setuptools.package-data]
"gsend_cad.ui" = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
